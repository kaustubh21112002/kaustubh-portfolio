<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Kaustubh K. Nandurkar</title>
    <meta name="theme-color" content="#0b0d13" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #0b0d13;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 32rem;
        width: 100%;
        background-color: #12141c;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1.5rem;
        padding: 2.5rem 2rem;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        background-color: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #f87171;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 1.5rem;
      }
      .badge-dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 9999px;
        background-color: #ef4444;
      }
      h1 {
        font-size: 3rem;
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 1;
        margin-bottom: 0.75rem;
        color: #ffffff;
      }
      p.subtitle {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 1.5rem;
      }
      p.desc {
        font-size: 0.9375rem;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 2rem;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      @media (min-width: 480px) {
        .actions {
          flex-direction: row;
          justify-content: center;
        }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        border-radius: 9999px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.8125rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s ease;
        cursor: pointer;
      }
      .btn-primary {
        background-color: #ffffff;
        color: #0b0d13;
        border: 1px solid #ffffff;
      }
      .btn-primary:hover {
        background-color: #e2e8f0;
      }
      .btn-secondary {
        background-color: rgba(255, 255, 255, 0.05);
        color: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .btn-secondary:hover {
        background-color: rgba(255, 255, 255, 0.1);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="badge">
        <span class="badge-dot" aria-hidden="true"></span>
        <span>HTTP 404 • Resource Not Found</span>
      </div>
      <h1>404</h1>
      <p class="subtitle">Requested Route Does Not Exist</p>
      <p class="desc">
        The URL path you requested does not map to any active research manuscript, valuation model, or case study in this portfolio.
      </p>
      <div class="actions">
        <a href="/" class="btn btn-primary">Return to Portfolio</a>
        <a href="/#projects" class="btn btn-secondary">Explore Projects</a>
      </div>
    </main>
  </body>
</html>
